name: Codex Branch Cleanup

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-branch-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Cleanup stale codex branches and PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const cutoffMs = 24 * 60 * 60 * 1000;
            const now = Date.now();
            const prefix = 'codex/';
            const bot = 'github-codex[bot]';
            const { owner, repo } = context.repo;

            const protectedNames = new Set(['main', 'master', 'develop', 'prod', 'production']);

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            for (const branch of branches) {
              const name = branch.name;
              if (!name.startsWith(prefix)) continue;
              if (protectedNames.has(name)) continue;

              const commitDate = branch?.commit?.commit?.committer?.date || branch?.commit?.commit?.author?.date;
              if (!commitDate) continue;

              const ageMs = now - Date.parse(commitDate);
              if (!Number.isFinite(ageMs) || ageMs <= cutoffMs) continue;

              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                core.info(`Deleted stale branch ${name}`);
              } catch (error) {
                core.warning(`Could not delete ${name}: ${error.message}`);
              }
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            for (const pr of pulls) {
              if (pr.user?.login !== bot) continue;

              const createdAt = Date.parse(pr.created_at);
              const ageMs = now - createdAt;
              if (!Number.isFinite(ageMs) || ageMs <= cutoffMs) continue;

              try {
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
                core.info(`Closed stale Codex PR #${pr.number}`);
              } catch (error) {
                core.warning(`Could not close PR #${pr.number}: ${error.message}`);
              }

              const headRef = pr.head?.ref;
              if (headRef && headRef.startsWith(prefix) && !protectedNames.has(headRef)) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${headRef}` });
                  core.info(`Deleted PR branch ${headRef}`);
                } catch (error) {
                  core.warning(`Could not delete PR branch ${headRef}: ${error.message}`);
                }
              }
            }
